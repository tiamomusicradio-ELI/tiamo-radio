<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIAMO MUSIC - רדיו אונליין</title>
    <style>
        :root {
            --main-bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary-gold: #d4af37;
            --gold-hover: #f3c653;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            text-align: right;
            overflow: hidden;
        }

        .landing-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 40px 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .station-logo h1 {
            color: var(--primary-gold);
            font-size: 28px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .station-logo p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 25px;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-green);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 25px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-green);
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .player-box {
            background: var(--main-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            outline: none;
            filter: sepia(20%) saturate(70%) grayscale(1) contrast(99%) invert(92%);
        }

        .admin-link {
            display: inline-block;
            color: var(--text-muted);
            font-size: 12px;
            text-decoration: none;
            transition: 0.2s;
            margin-top: 10px;
        }

        .admin-link:hover {
            color: var(--primary-gold);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <div class="station-logo">
            <h1>TIAMO MUSIC</h1>
            <p>התחנה העצמאית שלך - שידור חי 24/7</p>
        </div>

        <div class="live-indicator">
            <div class="pulse-dot"></div>
            <span>שידור חי באוויר</span>
        </div>

        <div class="player-box">
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">נגן הסטרימינג הראשי</p>
            <!-- הנגן מתחבר ישירות לנתיב הסטרימינג העצמאי בשרת -->
            <audio controls autoplay preload="auto">
                <source src="/stream" type="audio/mpeg">
                הדפדפן שלך אינו תומך בניגון אודיו.
            </audio>
        </div>

        <div>
            <a href="/admin" class="admin-link">⚙️ כניסה למערכת ניהול (מנהל בלבד)</a>
        </div>
    </div>

</body>
</html>
