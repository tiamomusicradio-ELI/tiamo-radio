<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIAMO MUSIC - רדיו אונליין</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --card-bg: #131b2e;
            --card-border: rgba(212, 175, 55, 0.2);
            --primary-gold: #d4af37;
            --gold-hover: #f3c653;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            text-align: right;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.07) 0%, transparent 60%);
        }

        .landing-container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 45px 35px;
            border-radius: 20px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(212, 175, 55, 0.05);
            position: relative;
        }

        .landing-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-gold), transparent);
        }

        .station-logo h1 {
            color: var(--primary-gold);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
        }

        .station-logo p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-green);
            padding: 6px 16px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-green);
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(16, 185, 129, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .player-box {
            background: rgba(9, 13, 22, 0.6);
            padding: 24px;
            border-radius: 14px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            margin-bottom: 25px;
        }

        .player-title {
            font-size: 13px;
            color: var(--primary-gold);
            margin-bottom: 12px;
            font-weight: 500;
        }

        audio {
            width: 100%;
            outline: none;
            filter: sepia(30%) saturate(80%) grayscale(0.8) contrast(1.1) invert(0.9);
            border-radius: 8px;
        }

        .admin-link {
            display: inline-block;
            color: var(--text-muted);
            font-size: 12px;
            text-decoration: none;
            transition: 0.2s;
            margin-top: 5px;
        }

        .admin-link:hover {
            color: var(--primary-gold);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <div class="station-logo">
            <h1>TIAMO MUSIC</h1>
            <p>התחנה העצמאית שלך - שידור חי 24/7</p>
        </div>

        <div class="live-indicator">
            <div class="pulse-dot"></div>
            <span>שידור חי באוויר</span>
        </div>

        <div class="player-box">
            <div class="player-title">נגן הסטרימינג הראשי</div>
            <audio controls autoplay preload="auto">
                <source src="/stream" type="audio/mpeg">
                הדפדפן שלך אינו תומך בניגון אודיו.
            </audio>
        </div>

        <div>
            <a href="/admin" class="admin-link">⚙️ כניסה למערכת ניהול (מנהל בלבד)</a>
        </div>
    </div>

</body>
</html>
