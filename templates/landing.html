<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIAMO MUSIC - רדיו אונליין</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url("{{ url_for('static', filename='background.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            text-align: center;
            direction: rtl;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            position: relative;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        /* המלבן הלבן המקורי */
        .white-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 15px;
            margin: 20px 0;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* גל קול מותאם למלבן הלבן */
        .white-box img {
            width: 100%;
            height: 60px;
            object-fit: fill;
        }
        .program-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
            margin: 15px 0;
            max-width: 600px;
            width: 80%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .program-title {
            font-size: 1.8rem;
            color: #ffdb4d;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .program-time {
            font-size: 1.2rem;
            color: #ddd;
        }
        .btn {
            background-color: #ffffff;
            color: #333;
            padding: 10px 25px;
            margin: 8px;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
        }
        .btn:hover {
            background-color: #ffdb4d;
            color: #000;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            color: #fff;
            box-shadow: 0 5px 25px rgba(0,0,0,0.7);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .close-btn {
            align-self: flex-start;
            font-size: 1.5rem;
            cursor: pointer;
            color: #aaa;
            margin-bottom: 10px;
        }
        .close-btn:hover {
            color: #fff;
        }
        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }
        .form-group label {
            margin-bottom: 5px;
            font-size: 1rem;
            color: #ffdb4d;
        }
        .form-group input {
            width: 85%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background-color: #0f172a;
            color: #fff;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- אזור לחיצה שקוף ומוסתר מעל הכינור (מיקום בצד ימין למעלה ברקע) -->
        <div id="secretAdminTrigger" title="" style="position: absolute; top: 15%; right: 8%; width: 200px; height: 400px; cursor: default; z-index: 999;"></div>

        <h1>TIAMO MUSIC</h1>

        <!-- אזור גל הקול בתוך המלבן הלבן -->
        <div class="white-box">
            <img src="{{ url_for('static', filename='waveform.png') }}" alt="גל קול" onerror="this.style.display='none'">
        </div>

        <!-- אזור הצגת התוכנית המשודרת כעת -->
        <div class="program-box">
            <div style="font-size: 1.1rem; margin-bottom: 5px;">אתם מאזינים לתוכנית:</div>
            <div id="currentProgramName" class="program-title">טוען תוכנית...</div>
            <div id="currentProgramTime" class="program-time">עד --:--</div>
        </div>

        <div>
            <a href="#about" class="btn">אודות התחנה</a>
            <button class="btn" onclick="openListenModal()">בא לי לשמוע</button>
            <button class="btn" onclick="openScheduleModal()">לוח שידורים</button>
        </div>

        <div style="margin-top: 15px; color: #ddd;">מוזיקה באווירה אחרת</div>

        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <a href="#" class="btn" style="padding: 5px 10px; border-radius: 50%;">✉</a>
            <a href="#" class="btn" style="padding: 5px 10px; border-radius: 50%;">💬</a>
            <a href="#" class="btn" style="padding: 5px 10px; border-radius: 50%;">f</a>
        </div>
    </div>

    <!-- מודאל "בא לי לשמוע" -->
    <div id="listenModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeListenModal()">&times;</span>
            <h2>בא לי לשמוע</h2>
            <div class="form-group">
                <label>שם מלא</label>
                <input type="text" placeholder="הכנס שם מלא">
            </div>
            <div class="form-group">
                <label>שם השיר המבוקש</label>
                <input type="text" placeholder="שם השיר">
            </div>
            <div class="form-group">
                <label>שם הזמר</label>
                <input type="text" placeholder="שם הזמר">
            </div>
            <div class="form-group">
                <label>בקשה מיוחדת</label>
                <input type="text" placeholder="הערות נוספות">
            </div>
            <button class="btn" style="width: 120px;" onclick="submitSongRequest()">שליחה</button>
        </div>
    </div>

    <!-- מודאל לוח שידורים -->
    <div id="scheduleModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeScheduleModal()">&times;</span>
            <h2>לוח שידורים שבועי</h2>
            <div id="scheduleContent" style="width: 100%;">טוען לוח שידורים...</div>
        </div>
    </div>

    <!-- סקריפטים -->
    <script>
        // לחיצה מוסתרת לניהול: החזק CTRL + SHIFT ולחץ על אזור הכינור
        document.getElementById('secretAdminTrigger').addEventListener('click', function(e) {
            if (e.ctrlKey && e.shiftKey) {
                e.preventDefault();
                window.location.href = "/admin";
            }
        });

        function updateProgramStatus() {
            fetch('/get_current_program_status')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('currentProgramName').innerText = data.program;
                        document.getElementById('currentProgramTime').innerText = "עד " + data.end_time;
                    } else {
                        document.getElementById('currentProgramName').innerText = "שידור רגיל";
                        document.getElementById('currentProgramTime').innerText = "עד --:--";
                    }
                })
                .catch(err => {
                    console.error('Error fetching program status:', err);
                });
        }

        updateProgramStatus();
        setInterval(updateProgramStatus, 60000);

        function openListenModal() {
            document.getElementById('listenModal').style.display = 'flex';
        }

        function closeListenModal() {
            document.getElementById('listenModal').style.display = 'none';
        }

        function submitSongRequest() {
            alert("הבקשה נשלחה בהצלחה!");
            closeListenModal();
        }

        function openScheduleModal() {
            document.getElementById('scheduleModal').style.display = 'flex';
            fetch('/get_full_schedule')
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        let html = '<table style="width:100%; border-collapse: collapse; margin-top: 15px;">';
                        data.data.forEach((row) => {
                            html += '<tr style="border-bottom: 1px solid #444;">';
                            row.forEach(cell => {
                                html += `<td style="padding: 8px; text-align: center;">${cell || ''}</td>`;
                            });
                            html += '</tr>';
                        });
                        html += '</table>';
                        document.getElementById('scheduleContent').innerHTML = html;
                    } else {
                        document.getElementById('scheduleContent').innerText = 'שגיאה בטעינת לוח השידורים';
                    }
                });
        }

        function closeScheduleModal() {
            document.getElementById('scheduleModal').style.display = 'none';
        }
    </script>
</body>
</html>
