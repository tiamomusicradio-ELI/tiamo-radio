<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIAMO MUSIC - רדיו אונליין</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --panel-bg: rgba(15, 22, 36, 0.85);
            --gold: #d4af37;
            --gold-light: #f3c653;
            --text-main: #ffffff;
            --text-secondary: #a0aec0;
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(135deg, rgba(5, 7, 10, 0.9), rgba(20, 30, 48, 0.95)), 
                              url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }

        .main-card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 50px 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.1);
        }

        .logo-area h1 {
            color: var(--gold);
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 2px 15px rgba(212, 175, 55, 0.3);
        }

        .logo-area p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 30px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            animation: glowing 1.5s infinite;
        }

        @keyframes glowing {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .player-wrapper {
            background: rgba(5, 7, 10, 0.7);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            margin-bottom: 30px;
        }

        .player-label {
            font-size: 14px;
            color: var(--gold);
            margin-bottom: 15px;
            font-weight: 500;
        }

        audio {
            width: 100%;
            outline: none;
            filter: sepia(40%) saturate(70%) grayscale(0.5) contrast(1.2) invert(0.92);
            border-radius: 8px;
        }

        .admin-btn {
            display: inline-block;
            color: var(--text-secondary);
            font-size: 13px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .admin-btn:hover {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-area">
            <h1>TIAMO MUSIC</h1>
            <p>התחנה העצמאית שלך - שידור חי 24/7</p>
        </div>

        <div class="live-badge">
            <div class="dot"></div>
            <span>שידור חי באוויר</span>
        </div>

        <div class="player-wrapper">
            <div class="player-label">נגן הסטרימינג הראשי</div>
            <audio controls autoplay preload="auto">
                <source src="/stream" type="audio/mpeg">
                הדפדפן שלך אינו תומך בניגון אודיו.
            </audio>
        </div>

        <div>
            <a href="/admin" class="admin-btn">⚙️ כניסה למערכת ניהול (מנהל בלבד)</a>
        </div>
    </div>

</body>
</html>
