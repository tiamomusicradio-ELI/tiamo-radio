<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIAMO MUSIC - מוזיקה באווירה אחרת</title>
    <style>
        :root {
            --bg-deep: #05070c;
            --glass-bg: rgba(18, 24, 38, 0.78);
            --gold: #d4af37;
            --gold-light: #f3c653;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-gold: rgba(212, 175, 55, 0.4);
            --live-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: linear-gradient(rgba(5, 7, 12, 0.4), rgba(5, 7, 12, 0.65)),
                              url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 40px;
        }

        header {
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-gold);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--gold);
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            text-decoration: none;
        }

        .brand-logo span {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, 0.2);
            font-size: 15px;
        }

        nav ul {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
        }

        nav ul li a:hover, nav ul li a.active { color: var(--gold); }

        .listen-live-btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #000;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transition: 0.3s;
        }

        .listen-live-btn:hover { transform: scale(1.05); }

        .dashboard-container {
            width: 100%;
            max-width: 1350px;
            margin: 25px auto;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
        }

        .section-title {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 12px;
            font-weight: 800;
            text-align: right;
        }

        .now-playing-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1.5px solid var(--border-gold);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.1);
        }

        .now-playing-content {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .album-art-box {
            width: 180px;
            height: 180px;
            flex-shrink: 0;
            border-radius: 20px;
            background: radial-gradient(circle, rgba(26,34,51,0.8) 0%, rgba(5,7,10,0.9) 100%);
            border: 2px solid var(--gold);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            padding: 15px;
            text-align: center;
        }

        .live-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 10px;
            font-weight: 800;
            color: var(--live-green);
            background: rgba(16, 185, 129, 0.18);
            padding: 3px 10px;
            border-radius: 10px;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .rotating-coin {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            background: radial-gradient(circle, #111522 0%, #05070a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: coinRotate 12s linear infinite;
            box-shadow: 0 0 15px rgba(212,175,55,0.4);
            margin-bottom: 8px;
        }

        @keyframes coinRotate {
            0% { transform: perspective(600px) rotateY(0deg); }
            100% { transform: perspective(600px) rotateY(360deg); }
        }

        .track-details {
            flex-grow: 1;
            text-align: right;
        }

        .track-details h2 {
            font-size: 24
