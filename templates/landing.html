<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIAMO MUSIC - מוזיקה באווירה אחרת</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3c653;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --live-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #05070c;
            background-image: linear-gradient(rgba(5, 7, 12, 0.25), rgba(5, 7, 12, 0.55)),
                              url("{{ url_for('static', filename='ULPAN HADASH.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 30px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 35px;
            background: rgba(10, 14, 23, 0.65);
            backdrop-filter: blur(15px);
            border: 1.5px solid rgba(212, 175, 55, 0.45);
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
        }

        .brand-box {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            color: var(--gold);
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 3px 15px rgba(212, 175, 55, 0.7), 0 2px 5px rgba(0,0,0,0.9);
        }

        .brand-slogan {
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-top: 4px;
            font-weight: 600;
        }

        nav ul {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
            cursor: pointer;
        }

        nav ul li a:hover, nav ul li a.active { color: var(--gold); }

        .hero-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: 20px 0;
        }

        .now-playing-banner {
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(20px);
            border: 1.5px solid var(--gold);
            padding: 12px 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            max-width: 500px;
            width: 100%;
            text-align: right;
        }

        .studio-buttons-container {
            display: flex;
            gap: 18px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: auto;
            margin-bottom: auto;
        }

        .studio-3d-btn {
            background: linear-gradient(145deg, #3d3422, #1c180e);
            border: 3px solid rgba(212, 175, 55, 0.7);
            color: var(--gold-light);
            padding: 18px 15px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 150px;
            height: 120px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), 
                        inset 0 3px 6px rgba(255,255,255,0.35), 
                        inset 0 -5px 10px rgba(0,0,0,0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .studio-3d-btn.schedule-btn {
            background: linear-gradient(145deg, #475569, #1e293b);
            border-color: rgba(148, 163, 184, 0.5);
            color: #f8fafc;
        }

        .studio-3d-btn.about-btn {
            background: linear-gradient(145deg, #2b2b2b, #111111);
            border-color: rgba(255, 255, 255, 0.3);
            color: #e2e8f0;
        }

        .studio-3d-btn.main-play {
            background: linear-gradient(145deg, #d4af37, #8c7324);
            border: 4px solid #ffffff;
            color: #050507;
            width: 180px;
            height: 140px;
            font-size: 18px;
            box-shadow: 0 20px 45px rgba(212, 175, 55, 0.6), 
                        inset 0 4px 8px rgba(255,255,255,0.7), 
                        inset 0 -6px 12px rgba(0,0,0,0.5);
            transform: translateY(-8px);
        }

        .studio-3d-btn.caster-btn {
            background: linear-gradient(145deg, #1e3a8a, #0f172a);
            border-color: rgba(96, 165, 250, 0.8);
            color: #60a5fa;
            font-size: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), 
                        inset 0 3px 6px rgba(96, 165, 250, 0.4), 
                        inset 0 -5px 10px rgba(0,0,0,0.8);
        }

        .studio-3d-btn.whatsapp-btn {
            background: linear-gradient(145deg, #1b4d2e, #0a2213);
            border-color: rgba(37, 211, 102, 0.8);
            color: #25d366;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), 
                        inset 0 3px 6px rgba(37, 211, 102, 0.4), 
                        inset 0 -5px 10px rgba(0,0,0,0.8);
        }

        .studio-3d-btn:hover {
            transform: translateY(-12px) scale(1.05);
            box-shadow: 0 25px 50px rgba(212, 175, 55, 0.5);
        }

        .studio-3d-btn.main-play:hover { background: linear-gradient(145deg, #f3c653, #d4af37); color: #000; }
        .studio-3d-btn.whatsapp-btn:hover { background: linear-gradient(145deg, #25d366, #1b4d2e); color: #fff; }
        .studio-3d-btn.caster-btn:hover { background: linear-gradient(145deg, #3b82f6, #1e3a8a); color: #fff; }

        footer {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(10, 14, 23, 0.65);
            backdrop-filter: blur(15px);
            border-radius: 18px;
        }

        .footer-social {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .footer-social a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }

        .footer-social a:hover { color: var(--gold); }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: rgba(13, 18, 28, 0.95);
            border: 2px solid var(--gold);
            padding: 30px;
            border-radius: 25px;
            width: 95%;
            max-width: 650px;
            text-align: right;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 20px;
            color: var(--text-muted);
            font-size: 26px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-box">
            <div class="brand-title">TIAMO MUSIC</div>
            <div class="brand-slogan">מוזיקה באווירה אחרת</div>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">ראשי</a></li>
                <li><a href="javascript:void(0);" onclick="openScheduleModal()">לוח שידורים</a></li>
                <li><a href="javascript:void(0);" onclick="openAboutModal()">אודות</a></li>
                <li><a href="/admin">ניהול</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero-stage">
        
        <div id="playing-status-banner" class="now-playing-banner"
