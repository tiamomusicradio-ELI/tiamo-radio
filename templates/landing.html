<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIAMO MUSIC RADIO - שידור חי</title>
    <link rel="shortcut icon" href="/static/favicon.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            background-image: url('/static/background.740792a413912a029ca7.jpeg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }
        .header {
            text-align: center;
            margin-top: 10px;
        }
        .header h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            color: #ffbb33;
        }
        .player-container {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            text-align: center;
            width: 100%;
            max-width: 500px;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.9);
            color: #222;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:hover {
            background: #ffbb33;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- כותרת האתר -->
    <div class="header">
        <h1>TIAMO MUSIC</h1>
    </div>

    <!-- כפתורי הניווט והתפריטים -->
    <div class="menu-buttons">
        <a href="#" class="btn">אודות התחנה</a>
        <a href="#" class="btn">בא לי לשמוע</a>
        <a href="#" class="btn">לוח שידורים</a>
    </div>

    <!-- נגן האודיו / אזור השידור -->
    <div class="player-container">
        <p style="margin-bottom: 10px; font-size: 1.1rem;">אתם מאזינים לתוכנית: שידור חי</p>
        <!-- כאן אפשר להוסיף את תגית ה-audio או הנגן שלך -->
        <audio controls style="width: 100%;">
            <source src="http://your-streaming-server-url" type="audio/mpeg">
            הדפדפן שלך לא תומך بنגן שמע.
        </audio>
    </div>

</body>
</html>
